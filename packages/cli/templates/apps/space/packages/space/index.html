<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#141518" />
    <title>Space</title>
    <!-- use-credentials: without it Chrome fetches the manifest with no cookies, meets Access's sign-in page instead, and never offers to install. The manifest and the
         icons sit behind the same sign-in as the app. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- An iPhone or iPad opens what is added to its Home Screen as an app (and delivers push to it) when the manifest says standalone. The manifest is fetched
         behind the sign-in, as above; these two say the same in the page itself, which Safari has just loaded signed in, so the app is standalone even if it could
         not read the manifest. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
