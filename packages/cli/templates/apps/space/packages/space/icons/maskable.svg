<!-- The maskable icon, which Android cuts to its own shape: the mark sits inside the central circle of 80% that every shape keeps. rsvg-convert -w 512 -h 512 icons/maskable.svg -o public/icons/maskable-512.png. Run from packages/space. The mark is the four tabs as four tiles in the space's accent; a new design changes the paths in all three. -->
