<!-- The badge, one colour on transparent, for Android's status bar (Android uses only its alpha). rsvg-convert -w 96 -h 96 icons/badge.svg -o public/icons/badge-96.png. Run from packages/space. The mark is the same four tiles, in white; a new design changes the paths in all three. -->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><g fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"><rect x="20" y="20" width="22" height="22" rx="6"/><rect x="54" y="20" width="22" height="22" rx="6"/><rect x="20" y="54" width="22" height="22" rx="6"/><rect x="54" y="54" width="22" height="22" rx="6"/></g></svg>
