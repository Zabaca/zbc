# walgit on Fly. The topology lives here, not in the zbc `fly` module — the
# module only runs `fly deploy` against this file.
#
# The app name is a per-project identity, so an instance in a consumer's
# environment overrides it with `appName`. This default is what `fly deploy`
# uses if nothing does.
app = "walgit"
primary_region = "sjc"

[build]

# SSH: RAW TCP PASS-THROUGH. The absence of `handlers` is what makes it raw —
# adding one would make Fly Proxy try to speak HTTP or TLS to a git client and
# every connection would fail. Verified against real Fly in the walgit M0 spike
# (docs/research/walgit-m0-spike/ in the zbc repository).
#
# A dedicated IPv4 is REQUIRED for this to be reachable at all: shared IPv4
# covers ports 80/443 only, and nothing reports the difference. The instance
# sets `ipv4: "dedicated"`.
[[services]]
  protocol = "tcp"
  # 2222 inside, 22 outside. Port 22 on the machine belongs to Fly's hallpass;
  # binding it here kills the machine at boot. See sshd_config.
  internal_port = 2222
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 22

# smart-HTTP. Same autostop policy, so both front doors wake the same machine;
# the M0 spike measured a raw-TCP cold start at ~1.35 s, which a git client
# spends waiting and never notices.
[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # The only health check, and one is enough for both front doors: entrypoint.sh
  # runs sshd and the HTTP server so that either dying kills the other, on the
  # grounds that half a git host should stop rather than keep answering. So an
  # sshd that died is an HTTP server that is already gone, and this check sees it.
  #
  # It exists for the failure autostart cannot see. Autostart reacts to CAPACITY
  # — it starts another machine when the running ones are over their soft limit —
  # and a machine that is up, accepting TCP, and broken presents no capacity
  # pressure at all. Without a check the proxy keeps routing to it.
  #
  # `/_walgit/health` is unauthenticated on purpose (src/http.ts): Fly's checker
  # carries no credential, and the endpoint reveals only that a machine is up.
  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "get"
    path = "/_walgit/health"

# No [[mounts]]. Deliberate: see the Dockerfile — the repo on disk is a cache.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
