<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox</title>
<style>
  /* Prose design system tokens (mirrored from packages/design-system/src/tokens.css;
     the inbox UI is a self-contained static page, so no Tailwind pipeline). */
  :root {
    color-scheme: light dark;
    --paper-0: #FBFAF7; --paper-1: #F4F2EC; --paper-2: #EAE6DC; --paper-3: #DCD6C7;
    --ink-0: #14140F; --ink-1: #2D2C25; --ink-2: #5A584C; --ink-3: #8A8676; --ink-4: #B8B3A1;
    --accent: #B8410E; --accent-soft: #E8D5C4; --accent-ink: #6B2308;
    --positive: #2F6B3C; --critical: #A8321A;
    --font-display: 'Iowan Old Style', 'Source Serif Pro', Georgia, 'Times New Roman', serif;
    --font-ui: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
    --dur-fast: 140ms; --ease: cubic-bezier(0.2, 0.6, 0.2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper-0: #14130E; --paper-1: #1C1B16; --paper-2: #25241D; --paper-3: #34322A;
      --ink-0: #F2EFE6; --ink-1: #DDD8C9; --ink-2: #A8A290; --ink-3: #75705F; --ink-4: #4A463C;
      --accent: #E26B3A; --accent-soft: #3A2418; --accent-ink: #F0A57E;
      --positive: #6FAE7C; --critical: #E2674F;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 400 0.9375rem/1.5 var(--font-ui);
    background: var(--paper-0);
    color: var(--ink-1);
  }
  button {
    font: 500 0.8125rem/1 var(--font-ui);
    letter-spacing: 0.04em;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--ink-4);
    border-radius: 2px;
    background: transparent;
    color: var(--ink-1);
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
  }
  button:hover { background: var(--paper-2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #FBFAF7; }
  button.primary:hover { filter: brightness(1.08); background: var(--accent); }
  button.danger { color: var(--critical); border-color: var(--critical); }

  header {
    display: flex; align-items: baseline; gap: 0.75rem;
    padding: 0.75rem 1.5rem;
    border-bottom: 2px solid var(--ink-0);
    background: var(--paper-0);
  }
  header h1 { font: 600 1.375rem/1.1 var(--font-display); letter-spacing: -0.015em; margin: 0; color: var(--ink-0); }
  header .domain { font: 400 0.8125rem/1 var(--font-mono); color: var(--ink-3); }
  header .spacer { flex: 1; }
  header .actions { display: flex; gap: 0.5rem; align-self: center; }

  main { display: grid; grid-template-columns: minmax(280px, 400px) 1fr; height: calc(100dvh - 56px); }
  #list { overflow-y: auto; border-right: 1px solid var(--paper-3); background: var(--paper-0); }
  #reader { overflow-y: auto; background: var(--paper-1); }

  .thread {
    padding: 0.75rem 1.5rem;
    border-bottom: 1px solid var(--paper-3);
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease);
  }
  .thread:hover { background: var(--paper-1); }
  .thread.active { background: var(--paper-2); box-shadow: inset 2px 0 0 var(--accent); }
  .thread .top { display: flex; align-items: baseline; gap: 0.5rem; }
  .thread .who { font-weight: 600; color: var(--ink-0); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .thread .when { font-size: 0.75rem; color: var(--ink-3); white-space: nowrap; }
  .thread .subject { display: block; color: var(--ink-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread .snippet {
    color: var(--ink-3); font-size: 0.8125rem;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .badge {
    font-size: 0.6875rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 0.125rem 0.375rem; border-radius: 2px;
  }
  .badge.count { background: var(--paper-2); color: var(--ink-2); }
  .badge.sent { background: var(--accent-soft); color: var(--accent-ink); }

  /* Conversation view */
  .convo { max-width: 46rem; margin: 0 auto; padding: 1.5rem; }
  .convo-head { display: flex; align-items: baseline; gap: 0.75rem; margin-bottom: 1.5rem; }
  .convo-head h2 { font: 600 1.75rem/1.1 var(--font-display); letter-spacing: -0.015em; color: var(--ink-0); margin: 0; flex: 1; }
  #back { display: none; }

  .bubble {
    background: var(--paper-0);
    border: 1px solid var(--paper-3);
    border-radius: 2px;
    margin-bottom: 1rem;
  }
  .bubble.outbound { border-left: 2px solid var(--accent); background: var(--paper-1); }
  .bubble .head {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem;
    padding: 0.75rem 1rem; cursor: pointer;
  }
  .bubble .head .who { font-weight: 600; color: var(--ink-0); }
  .bubble .head .arrow { color: var(--ink-3); font-size: 0.8125rem; }
  .bubble .head .when { margin-left: auto; font-size: 0.75rem; color: var(--ink-3); white-space: nowrap; }
  .bubble .body { padding: 0 1rem 1rem; border-top: 1px solid var(--paper-2); padding-top: 0.75rem; }
  .bubble.collapsed .body, .bubble.collapsed .tools { display: none; }
  .bubble.collapsed .head .preview { color: var(--ink-3); font-size: 0.8125rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 24rem; }
  .bubble pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; margin: 0; color: var(--ink-1); }
  .bubble iframe { width: 100%; min-height: 20rem; border: 1px solid var(--paper-3); border-radius: 2px; background: #fff; }
  .bubble .tools { display: flex; gap: 0.5rem; padding: 0 1rem 0.75rem; }
  .bubble .tools button { font-size: 0.6875rem; padding: 0.25rem 0.5rem; color: var(--ink-2); }

  .reply-bar { display: flex; gap: 0.5rem; margin-top: 0.5rem; }

  dialog {
    border: 1px solid var(--paper-3); border-radius: 2px;
    background: var(--paper-0); color: var(--ink-1);
    padding: 1.5rem; width: min(560px, 92vw);
  }
  dialog::backdrop { background: rgba(20, 20, 15, 0.5); }
  dialog h3 { font: 600 1.375rem/1.1 var(--font-display); color: var(--ink-0); margin: 0 0 1rem; }
  form.compose { display: grid; gap: 0.5rem; }
  form.compose input, form.compose textarea {
    font: inherit; padding: 0.5rem 0.625rem;
    border: 1px solid var(--ink-4); border-radius: 2px;
    background: var(--paper-0); color: var(--ink-1); width: 100%;
  }
  form.compose input::placeholder, form.compose textarea::placeholder { color: var(--ink-3); }
  form.compose input:focus, form.compose textarea:focus { outline: none; border-color: var(--accent); }
  form.compose textarea { min-height: 10rem; resize: vertical; }
  .row { display: flex; gap: 0.5rem; justify-content: flex-end; }
  .empty { padding: 4rem 1.5rem; text-align: center; color: var(--ink-3); font: 400 1.125rem/1.5 var(--font-display); font-style: italic; }
  #loadmore { display: block; margin: 0.75rem auto; }

  /* Mobile: single pane, list <-> conversation */
  @media (max-width: 45rem) {
    main { grid-template-columns: 1fr; }
    #list { border-right: none; }
    main.reading #list { display: none; }
    main:not(.reading) #reader { display: none; }
    #back { display: inline-block; }
    header { padding: 0.625rem 1rem; }
    header .domain { display: none; }
    .thread { padding: 0.75rem 1rem; }
    .convo { padding: 1rem; }
    .bubble .head .preview { max-width: 40vw; }
  }
</style>
</head>
<body>
<header>
  <h1>Inbox</h1>
  <span class="domain"></span>
  <span class="spacer"></span>
  <div class="actions">
    <button id="compose-btn" class="primary">Compose</button>
    <button id="refresh-btn">Refresh</button>
    <button id="token-btn">Token</button>
  </div>
</header>
<main id="main">
  <div id="list"><div class="empty">Loading…</div></div>
  <div id="reader"><div class="empty">Select a conversation</div></div>
</main>

<dialog id="compose">
  <h3 id="compose-title">New message</h3>
  <form class="compose" id="compose-form" method="dialog">
    <input name="to" placeholder="To" required>
    <input name="from" placeholder="From (optional, defaults to DEFAULT_FROM)">
    <input name="subject" placeholder="Subject" required>
    <input name="inReplyTo" type="hidden">
    <textarea name="text" placeholder="Message" required></textarea>
    <div class="row">
      <button type="button" id="compose-cancel">Cancel</button>
      <button type="submit" class="primary">Send</button>
    </div>
  </form>
</dialog>

<script>
const $ = (s) => document.querySelector(s)
let token = localStorage.getItem('inbox_token') || ''
let cursor = null
let currentThread = null

function askToken(force) {
  if (token && !force) return token
  const t = prompt('Inbox API token (stored in localStorage):', token)
  if (t !== null) { token = t.trim(); localStorage.setItem('inbox_token', token) }
  return token
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json', ...(opts.headers || {}) },
  })
  if (res.status === 401) { askToken(true); throw new Error('unauthorized — token updated, retry') }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText)
  return res.json()
}

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
function fmtDate(d) {
  const t = new Date(d)
  if (isNaN(t)) return ''
  const sameDay = t.toDateString() === new Date().toDateString()
  return sameDay
    ? t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
    : t.toLocaleDateString([], { month: 'short', day: 'numeric' }) +
      (t.getFullYear() !== new Date().getFullYear() ? ' ' + t.getFullYear() : '')
}

async function loadList(append) {
  askToken(false)
  try {
    const q = append && cursor ? '?cursor=' + encodeURIComponent(cursor) : ''
    const data = await api('/api/threads' + q)
    cursor = data.nextCursor
    const html = data.threads.map((t) => {
      const who = t.direction === 'outbound' ? t.to_addr : t.from_addr
      const badges =
        (t.thread_count > 1 ? `<span class="badge count">${t.thread_count}</span>` : '') +
        (t.direction === 'outbound' ? '<span class="badge sent">sent</span>' : '')
      return `
      <div class="thread" data-thread="${esc(t.thread_id)}">
        <div class="top">
          <span class="who">${esc(who)}</span>
          ${badges}
          <span class="when">${esc(fmtDate(t.created_at))}</span>
        </div>
        <span class="subject">${esc(t.subject) || '(no subject)'}</span>
        <span class="snippet">${esc(t.snippet)}</span>
      </div>`
    }).join('')
    const more = cursor ? '<button id="loadmore">Load more</button>' : ''
    if (append) { $('#loadmore')?.remove(); $('#list').insertAdjacentHTML('beforeend', html + more) }
    else $('#list').innerHTML = (html || '<div class="empty">No messages yet</div>') + more
    if (currentThread) highlightActive()
  } catch (e) {
    $('#list').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'
  }
}

function highlightActive() {
  document.querySelectorAll('.thread').forEach((el) =>
    el.classList.toggle('active', el.dataset.thread === currentThread))
}

async function openThread(threadId) {
  currentThread = threadId
  highlightActive()
  $('#main').classList.add('reading')
  $('#reader').innerHTML = '<div class="empty">Loading…</div>'
  try {
    const { messages } = await api('/api/threads/' + encodeURIComponent(threadId))
    const last = messages[messages.length - 1]
    const bubbles = messages.map((m, i) => {
      const collapsed = messages.length > 1 && i < messages.length - 1
      const out = m.direction === 'outbound'
      return `
      <div class="bubble ${out ? 'outbound' : ''} ${collapsed ? 'collapsed' : ''}" data-id="${esc(m.id)}">
        <div class="head">
          <span class="who">${esc(out ? 'You' : m.from_addr)}</span>
          <span class="arrow">→ ${esc(m.to_addr)}</span>
          ${out ? '<span class="badge sent">sent</span>' : ''}
          <span class="preview">${esc(m.snippet)}</span>
          <span class="when">${esc(fmtDate(m.date || m.created_at))}</span>
        </div>
        <div class="body">${m.html_body
          ? `<iframe sandbox="" referrerpolicy="no-referrer"></iframe>`
          : `<pre>${esc(m.text_body)}</pre>`}</div>
        <div class="tools">
          ${m.r2_key ? `<button class="raw" data-id="${esc(m.id)}">Raw</button>` : ''}
          <button class="del danger" data-id="${esc(m.id)}">Delete</button>
        </div>
      </div>`
    }).join('')
    $('#reader').innerHTML = `
      <div class="convo">
        <div class="convo-head">
          <button id="back">← Back</button>
          <h2>${esc(last.subject) || '(no subject)'}</h2>
        </div>
        ${bubbles}
        <div class="reply-bar">
          <button id="reply-btn" class="primary">Reply</button>
        </div>
      </div>`
    // srcdoc can't be set via innerHTML string safely; bind after render.
    messages.forEach((m) => {
      if (!m.html_body) return
      const frame = document.querySelector(`.bubble[data-id="${CSS.escape(m.id)}"] iframe`)
      if (frame) frame.srcdoc = m.html_body
    })
    $('#back').onclick = () => { $('#main').classList.remove('reading'); currentThread = null; highlightActive() }
    const replyTo = [...messages].reverse().find((m) => m.direction === 'inbound') || last
    $('#reply-btn').onclick = () => openCompose({
      to: replyTo.direction === 'outbound' ? replyTo.to_addr : replyTo.from_addr,
      from: replyTo.direction === 'outbound' ? replyTo.from_addr : replyTo.to_addr,
      subject: (last.subject || '').match(/^re:/i) ? last.subject : 'Re: ' + (last.subject || ''),
      inReplyTo: last.message_id,
    }, 'Reply')
  } catch (e) {
    $('#reader').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'
  }
}

function openCompose(prefill = {}, title = 'New message') {
  const f = $('#compose-form')
  f.reset()
  $('#compose-title').textContent = title
  for (const [k, v] of Object.entries(prefill)) if (f[k]) f[k].value = v || ''
  $('#compose').showModal()
  f.text.focus()
}

$('#compose-form').addEventListener('submit', async (e) => {
  e.preventDefault()
  const f = e.target
  const body = Object.fromEntries(['to', 'from', 'subject', 'inReplyTo', 'text']
    .map((k) => [k, f[k].value.trim()]).filter(([, v]) => v))
  try {
    const r = await api('/api/send', { method: 'POST', body: JSON.stringify(body) })
    $('#compose').close()
    await loadList()
    if (r.threadId) openThread(r.threadId)
  } catch (err) { alert('Send failed: ' + err.message) }
})

$('#compose-cancel').onclick = () => $('#compose').close()
$('#compose-btn').onclick = () => openCompose()
$('#refresh-btn').onclick = () => loadList()
$('#token-btn').onclick = () => { askToken(true); loadList() }

$('#list').addEventListener('click', (e) => {
  if (e.target.id === 'loadmore') return loadList(true)
  const t = e.target.closest('.thread')
  if (t) openThread(t.dataset.thread)
})

$('#reader').addEventListener('click', async (e) => {
  const head = e.target.closest('.bubble .head')
  if (head && !e.target.closest('button')) {
    head.closest('.bubble').classList.toggle('collapsed')
    return
  }
  const raw = e.target.closest('button.raw')
  if (raw) {
    const res = await fetch('/api/messages/' + raw.dataset.id + '/raw', { headers: { authorization: 'Bearer ' + token } })
    const blob = await res.blob()
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: raw.dataset.id + '.eml' })
    a.click()
    return
  }
  const del = e.target.closest('button.del')
  if (del) {
    if (!confirm('Delete this message?')) return
    await api('/api/messages/' + del.dataset.id, { method: 'DELETE' })
    const thread = currentThread
    await loadList()
    const stillThere = document.querySelector(`.thread[data-thread="${CSS.escape(thread)}"]`)
    if (stillThere) openThread(thread)
    else { $('#reader').innerHTML = '<div class="empty">Deleted</div>'; $('#main').classList.remove('reading'); currentThread = null }
  }
})

loadList()
</script>
</body>
</html>
