# Managed by zbc — do not edit by hand.
# NATS server for the landing pub/sub demo, run as a Cloudflare Container behind
# a Worker. TLS is terminated at the Cloudflare edge (client connects wss://),
# so the in-container listener is plain ws (`no_tls: true`).

http_port: 8222

websocket {
  port: 8080
  no_tls: true
}

# The landing page is public, and it hands this credential to every visitor via
# /api/nats-config — so treat it as public by construction and scope what it can
# do. Without these permissions the `app` user defaults to pub/sub on `>`, i.e.
# any visitor could read all traffic, forge any subject, or use the server as a
# free message bus.
authorization {
  users = [
    {
      user: app
      # Expanded from the container env at start (worker sets NATS_PASSWORD on
      # the container from the NATS_PASSWORD worker secret).
      password: $NATS_PASSWORD
      permissions: {
        publish:   { allow: ["landing.cursors.>"] }
        subscribe: { allow: ["landing.cursors.>"] }
      }
    }
  ]
}

# A cursor update is ~100 bytes. Anything larger is abuse, not a client.
max_payload: 8KB
write_deadline: "10s"
