# Managed by zbc — do not edit by hand.
# NATS server for the landing pub/sub demo, run as a Cloudflare Container behind
# a Worker. TLS is terminated at the Cloudflare edge (client connects wss://),
# so the in-container listener is plain ws (`no_tls: true`).

http_port: 8222

websocket {
  port: 8080
  no_tls: true
}

# Decentralized auth (NKeys + JWT), replacing the old shared `app`/$NATS_PASSWORD
# user. The landing page no longer holds any long-lived credential: the Worker
# mints a short-lived, per-session user JWT scoped to `landing.cursors.>`, and
# this server validates it against the operator-signed account below. A leaked
# token expires on its own and can move cursors and nothing else.
#
# The operator, SYS, and APP account JWTs are all PUBLIC (they carry only public
# keys and operator signatures) and are safe to commit. The one secret is the APP
# account signing-key seed, which never appears here — it lives in each
# environment's secrets.yaml (NATS_ACCOUNT_SIGNING_SEED) and is held only by the
# landing Worker. Regenerate the whole set with
# `bun packages/nats-server/scripts/gen-nats-identities.ts`.
#
