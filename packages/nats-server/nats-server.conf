# Managed by zbc — do not edit by hand.
# NATS server for the landing pub/sub demo, run as a Cloudflare Container behind
# a Worker. TLS is terminated at the Cloudflare edge (client connects wss://),
# so the in-container listener is plain ws (`no_tls: true`).

http_port: 8222

websocket {
  port: 8080
  no_tls: true
}

authorization {
  user: app
  # Expanded from the container env at start (worker sets NATS_PASSWORD on the
  # container from the NATS_PASSWORD worker secret).
  password: $NATS_PASSWORD
}

max_payload: 1MB
write_deadline: "10s"
