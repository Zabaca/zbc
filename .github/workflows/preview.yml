name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Apply preview + comment URLs
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # `set +e` is load-bearing. GitHub runs steps with `bash -e`, where an
          # assignment whose right-hand side is a failing command substitution
          # exits the shell AT THE ASSIGNMENT — so `STATUS=$?` and the echo below
          # never ran, and every failed preview apply produced a red job with an
          # empty log. The error was captured into OUTPUT and then thrown away.
          set +e
          OUTPUT=$(bun run --cwd packages/cli src/index.ts apply preview 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"

          # Pair each "Deployed:" URL with the most recent "→ <module>:<name>" header
          # (module-agnostic: works for cloudflare and any future provider).
          LIST=$(echo "$OUTPUT" | awk '
            /^→ /{name=$2; sub(/^[^:]*:/, "", name)}
            /Deployed:/{print "- **" name "**: " $NF}
          ')

          if [ -z "$LIST" ]; then
            LIST="(no deployments captured — see logs)"
          fi

          BODY=$(printf '### Preview deployed :rocket:\n\n%s\n' "$LIST")

          # Update existing comment if present, else create a new one
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.body | startswith("### Preview deployed")) | .id' | head -1)

          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$EXISTING" -f body="$BODY"
          else
            gh pr comment ${{ github.event.pull_request.number }} --body "$BODY"
          fi

          exit $STATUS

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Destroy preview resources
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: bun run --cwd packages/cli src/index.ts destroy preview
