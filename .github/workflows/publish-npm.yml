# Publishes this repository's npm packages when a version field changes.
#
# For @zabaca/zbc this is the other half of a release: `publish-core.yml` splits
# the vendored subtree and tags `zbc-core-v<version>`; this ships the CLI that
# the same version names. Both are driven by `packages/cli/package.json`, and
# until 2026-08-22 only the first was automated — so npm sat at 0.10.2 while the
# repo reached 0.10.7, and the published package carried NINE of the
# twenty-three modules the tree actually ships. Anyone installing from npm got a
# CLI that could not `zbc add vm`. Nothing reported it, because nothing was
# failing.
#
# @zabaca/agentgit joined it on 2026-08-30, and for a sharper reason: the
# agentgit homepage prints `bunx @zabaca/agentgit watch` as the one command it
# asks anyone to run. A version in the repo that is not on npm is that command
# failing for every visitor, which is worse than a stale CLI — it is a broken
# promise on the front page.
#
# The matrix runs every package on every dispatch, which is deliberate: the
# already-published check makes the others a no-op, and a version that was
# missed heals on the next release of anything.
#
# ── Trusted publishing, since 2026-09-30 ──────────────────────────────────
# There is no npm token. Each package names this repository and this workflow
# file as its trusted publisher on npmjs.com, and the publish job proves it is
# that workflow with a GitHub OIDC token minted for the run. It replaced a
# granular token with 2FA bypass, for two reasons at once: that token expired
# under a 0.22.0 publish (a 404 from the registry, which is how npm refuses a
# credential for a scoped package), and npm is withdrawing publish rights from
# 2FA-bypass tokens altogether around January 2027
# (https://github.blog/changelog/2026-07-08-npm-install-time-security-and-gat-bypass2fa-deprecation/).
#
# That shapes the whole file, in three ways:
#
#   - **Two jobs, not one.** npm accepts OIDC only from GitHub-HOSTED runners,
#     and @zabaca/agent's tests only run on a self-hosted one (see its matrix
#     entry). So `pack` tests and packs each package wherever it must, and
#     `publish` uploads the tarball from a hosted runner. The tarball crosses as
#     an artifact, so what is published is byte-for-byte what was tested.
#   - **bun packs, npm publishes.** Only the npm CLI speaks trusted publishing.
#     But `npm publish` from the package directory drops `bin/zbc.js` — "bin[zbc]
#     script name bin/zbc.js was invalid and removed" (npm 11.6.2, 2026-09-30)
#     — which ships a CLI with no command. Handed a tarball `bun pm pack` built,
#     the same npm reports no correction. The dry run before the real publish
#     refuses if npm ever starts rewriting that manifest too.
#   - **Provenance is automatic**, because the repository is public. npm then
#     insists each package.json's `repository.url` names this repository, and
#     refuses the publish when it does not.
name: publish-npm

# **Manual only since 2026-09-03**, when releasing moved out of merging and into
# `/release`, which dispatches this.
on:
  workflow_dispatch:

concurrency: publish-npm

jobs:
  pack:
    # Per package, because only one of them needs a particular machine. The
    # matrix sets it; `ubuntu-latest` stays the default for anything that does
    # not ask. See `runner` on the @zabaca/agent entry below.
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      # Never cancel a sibling: two packages publishing in one run are
      # independent, and a failure in one must not leave the other half-shipped.
      fail-fast: false
      matrix:
        include:
          - package: '@zabaca/zbc'
            slug: zbc
            dir: packages/cli
            # What ships is what this covers. A version-only bump does not touch
            # `templates/infra`, so core-tests.yml does not fire on a release
            # commit — publishing without running these would put an untested
            # tree on npm under a version number consumers pin.
            test: bun test packages/cli/templates/infra
            build: ''
          - package: '@zabaca/agentgit'
            slug: agentgit
            dir: packages/agentgit
            # The published artefact is a bundle, and the suite builds it the
            # way `build` does and runs it under node. That is the only check
            # that catches a bun global reaching a package whose whole promise
            # is `npx` — neither the typechecker nor `bun test` alone can.
            test: bun test packages/agentgit/src
            build: bun run build
          - package: '@zabaca/agent'
            slug: agent
            dir: packages/agent
            # The one job that cannot run on a hosted runner. Its tests drive
            # the real sandbox rather than a stub, and `@anthropic-ai/sandbox-
            # runtime` refuses to start on Linux without `bwrap`, `socat` and
            # `rg` — none of which a GitHub VM has. Every one of the 25 tests
            # that touch it failed with one line, `Sandbox dependencies not
            # available`, from 2026-09-14 until this. It passes on a Mac
            # because macOS sandboxes with Seatbelt and never asks for them.
            #
            # `ryzen` is foundry's long-lived Incus guest, where those three are
            # installed as declared state rather than per run. An apt step here
            # would also have worked, and is the right answer for a fleet with
            # no such machine; this repo has one, and six sibling repos already
            # use it.
            #
            # Only packing happens here. The publish itself cannot: npm refuses
            # OIDC from a self-hosted runner.
            runner: [self-hosted, ryzen]
            # First consumer outside the workspace is the Zabaca fork of
            # claude-mem, which installs from npm — so unlike the other two
            # this is compiled with tsc, not bundled: it is a library, and the
            # consumer's own bundler wants the SDK as a real dependency.
            test: bun test packages/agent/src
            build: bun run build
    name: pack ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Test what ships
        run: ${{ matrix.test }}

      - name: Is this version already on npm?
        id: state
        run: |
          VERSION=$(jq -r .version ${{ matrix.dir }}/package.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "${{ matrix.package }}@${VERSION}" version >/dev/null 2>&1; then
            echo "published=yes" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.package }}@${VERSION} is already on npm — nothing to do"
          else
            echo "published=no" >> "$GITHUB_OUTPUT"
          fi

      # Only for a package that has one. Building in the pack job rather than
      # relying on a committed `dist/` is what keeps the artefact on npm
      # identical to the source this commit tested.
      - name: Build the artefact
        if: steps.state.outputs.published == 'no' && matrix.build != ''
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.build }}

      # `bun pm pack` is the packer `bun publish` used, so the tarball holds
      # what the token-era workflow shipped. A correct @zabaca/zbc is ~2 MB
      # unpacked; its file list is in this step's log.
      - name: Pack
        if: steps.state.outputs.published == 'no'
        working-directory: ${{ matrix.dir }}
        run: |
          rm -rf "${RUNNER_TEMP}/pack" && mkdir -p "${RUNNER_TEMP}/pack"
          bun pm pack --destination "${RUNNER_TEMP}/pack"
          count=$(find "${RUNNER_TEMP}/pack" -name '*.tgz' | wc -l)
          if [ "${count}" -ne 1 ]; then
            echo "::error::expected one tarball for ${{ matrix.package }}, found ${count}"
            exit 1
          fi

      - name: Hand the tarball to the publish job
        if: steps.state.outputs.published == 'no'
        uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.slug }}
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: pack
    # A failed pack elsewhere in the matrix must not hold back a package whose
    # own pack succeeded — the same reason `fail-fast` is off above. A package
    # with no tarball has nothing to publish, and its leg says so and stops;
    # the run is already red from the pack that failed.
    if: ${{ !cancelled() }}
    # GitHub-hosted, always: npm refuses trusted publishing from anything else.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: '@zabaca/zbc'
            slug: zbc
          - package: '@zabaca/agentgit'
            slug: agentgit
          - package: '@zabaca/agent'
            slug: agent
    name: publish ${{ matrix.package }}
    steps:
      - name: Fetch the tarball
        id: fetch
        # Absent when the pack job found the version already on npm, or failed.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: tarball-${{ matrix.slug }}
          path: ${{ runner.temp }}/pack

      - name: Anything to publish?
        id: state
        run: |
          TARBALL=$(find "${RUNNER_TEMP}/pack" -name '*.tgz' 2>/dev/null | head -1)
          if [ -z "${TARBALL}" ]; then
            echo "publish=no" >> "$GITHUB_OUTPUT"
            echo "no tarball for ${{ matrix.package }} — already on npm, or its pack failed (see the pack job)"
            exit 0
          fi
          VERSION=$(tar -xzOf "${TARBALL}" package/package.json | jq -r .version)
          echo "publish=yes" >> "$GITHUB_OUTPUT"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Trusted publishing needs npm >= 11.5.1 and node >= 22.14. No
      # `registry-url` here: it would write an .npmrc expecting a token.
      - uses: actions/setup-node@v4
        if: steps.state.outputs.publish == 'yes'
        with:
          node-version: 24

      - name: Install an npm that speaks OIDC
        if: steps.state.outputs.publish == 'yes'
        run: |
          npm install -g npm@^11.5.1
          npm --version

      # The shebang guard. A dry run prints what npm would change about the
      # manifest; any correction at all means the published package would not
      # be the one bun packed — for @zabaca/zbc, a CLI with no `zbc` command.
      - name: Refuse if npm would rewrite the manifest
        if: steps.state.outputs.publish == 'yes'
        run: |
          npm publish --dry-run --access public "${{ steps.state.outputs.tarball }}" 2>&1 | tee "${RUNNER_TEMP}/dry-run.log"
          if grep -qiE 'auto-corrected|was invalid and removed' "${RUNNER_TEMP}/dry-run.log"; then
            echo "::error::npm would rewrite ${{ matrix.package }}'s package.json on publish — see the lines above. Not publishing."
            exit 1
          fi

      # Verbose, because a failed OIDC exchange is otherwise silent: npm drops
      # to publishing with no credential and reports only `ENEEDAUTH` — which
      # is all the first trusted-publishing run said. The `oidc` lines at this
      # level carry the registry's actual reason, typically a trusted-publisher
      # setting on npmjs.com that does not match this repository or workflow.
      #
      # This step's exit code is the last thing the run checks. The registry
      # answers a trusted publish with `202 Accepted` and holds the version as
      # "Validating" for an automated review first; 0.22.0 was still there
      # after three minutes, so a polling step can only turn a good publish
      # red. Watch the versions tab on npmjs.com instead — and do not
      # re-dispatch while a version is Validating: `npm view` does not see it
      # yet, so this run would try to publish it a second time.
      - name: Publish
        if: steps.state.outputs.publish == 'yes'
        run: npm publish --access public --loglevel verbose "${{ steps.state.outputs.tarball }}"

