# walgit's own tests: the unit suite, then the seven guarantees it claims.
#
# `packages/cli/templates/apps/walgit/e2e/suite.ts` is one command that runs all
# seven scenarios from ADR-0007's acceptance tests against a REAL walgit node —
# a child process it can `kill -9`, real `git` clients over HTTP, and a real
# object store. Everything the scenarios test is about what happens when a
# process dies mid-push, which is exactly what a double cannot reproduce.
#
# **Per-PR, not nightly, and the reasoning is worth keeping.** A regression in
# any of these seven is data loss, and a nightly gate means it can be merged and
# built on for a day before anyone finds out. The cost that usually argues for
# nightly — real cloud infrastructure per run — does not apply here: the suite
# is self-contained on the runner. Only the optional bucket job below touches a
# provider, and that one IS nightly.
name: walgit-e2e

on:
  push:
    branches: [main]
    paths:
      - 'packages/cli/templates/apps/walgit/**'
      - '.github/workflows/walgit-e2e.yml'
  pull_request:
    paths:
      - 'packages/cli/templates/apps/walgit/**'
      - '.github/workflows/walgit-e2e.yml'
  schedule:
    # 04:00 UTC — the nightly run is what exercises a real bucket.
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: walgit-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The branches, before the scenarios. `bun test src` covers CAS linearization,
  # the push path, reconcile, materialize, the compaction lease and the GC grace
  # periods — the places where being wrong loses data — and until now it ran
  # only wherever someone happened to run it. It is ~70 s and self-contained, so
  # it goes first and the e2e job `needs:` it: a broken assertion should not wait
  # behind a run that spins up a real node.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/cli/templates/apps/walgit
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install
        working-directory: .

      # Both TypeScript programs, because walgit is two of them: `src/` +
      # `shared/` against bun's ambient types, `worker/` + `shared/` against the
      # Workers runtime's. That overlap is the whole point of the shared kernel
      # (docs/adr/0010) — "this module imports no runtime" is a claim only a
      # typecheck of both can hold to.
      #
      # Nothing ran this before, and four errors had accumulated by the time
      # anyone looked, one of them real: the backpressure policy read a
      # `bufferedAmount` the Workers `WebSocket` type does not declare.
      #
      # Scoped to this package rather than the repository, because each program
      # that ships is gated where it ships: `packages/infra`'s seven errors were
      # the reason this line stayed narrow, and now that they are fixed
      # core-tests.yml typechecks the modules consumers vendor under its own
      # path filter. Neither gate widens to `tsc` over the repository — the
      # packages with no gate yet get one where their tests already run.
      - name: Typecheck
        run: bun run typecheck

      # The suite shells out to real `git` and writes to the OS temp directory;
      # ubuntu-latest has git preinstalled. Scoped to `src` rather than the
      # package root so it stays the unit suite — `e2e/` is the job below.
      - name: Unit suite
        run: bun test src

  # The full seven, against a FileStore on the runner's disk. Self-contained:
  # no credentials, no provider, nothing to leak or pay for.
  suite:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/cli/templates/apps/walgit
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install
        working-directory: .

      # No `--quick` and no `--only`: the suite exits 2 on a partial run
      # precisely so a narrowed sweep cannot pass for a full one here.
      - name: Seven scenarios
        run: bun run e2e/suite.ts
        env:
          WALGIT_E2E_JSON: ${{ runner.temp }}/walgit-e2e.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walgit-e2e-results
          path: ${{ runner.temp }}/walgit-e2e.json
          if-no-files-found: warn

  # The same seven against a real S3-compatible bucket, which is the only thing
  # that exercises the network round trip and the provider's own conditional
  # writes. Nightly rather than per-PR because it costs money and because a
  # fork's PR cannot have the secrets anyway.
  #
  # Skipped — loudly, in the job summary — when the secrets are absent, rather
  # than passing vacuously.
  bucket:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/cli/templates/apps/walgit
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install
        working-directory: .

      - name: Seven scenarios, against a real bucket
        env:
          WALGIT_S3_ENDPOINT: ${{ secrets.WALGIT_E2E_S3_ENDPOINT }}
          WALGIT_S3_BUCKET: ${{ secrets.WALGIT_E2E_S3_BUCKET }}
          WALGIT_S3_ACCESS_KEY_ID: ${{ secrets.WALGIT_E2E_S3_ACCESS_KEY_ID }}
          WALGIT_S3_SECRET_ACCESS_KEY: ${{ secrets.WALGIT_E2E_S3_SECRET_ACCESS_KEY }}
          # A bucket adds a round trip per WAL entry, so the local ceilings do
          # not apply. Set WALGIT_E2E_LATENCY_BASELINE to a file of its own once
          # this job has a few runs to baseline from; until then scenario 7
          # reports its numbers here and gates on the `suite` job.
          WALGIT_E2E_JSON: ${{ runner.temp }}/walgit-e2e-bucket.json
        run: |
          if [ -z "$WALGIT_S3_ENDPOINT" ]; then
            echo "::warning::walgit bucket e2e SKIPPED — WALGIT_E2E_S3_* secrets are not set." \
              "The seven scenarios ran against a local FileStore only."
            echo "walgit bucket e2e **skipped**: no bucket secrets configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bun run e2e/suite.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walgit-e2e-bucket-results
          path: ${{ runner.temp }}/walgit-e2e-bucket.json
          if-no-files-found: ignore
