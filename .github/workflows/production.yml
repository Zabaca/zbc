# Converges the production environment. **Manual only.**
#
# Until 2026-09-03 this fired on every push to main, which made merging and
# deploying the same act. They are not: a merge says the code is right, a deploy
# says now is the moment to move production. Releasing is now one deliberate
# step — `/release` — and this is the half of it that touches infrastructure.
#
# `instances` is what `scripts/affected-instances.ts` prints. `/release` runs
# that locally against the commits since the last release commit and passes the
# answer through; `ALL` (the default) converges the whole environment. Pass a
# narrower list only when you know what a change touched — the script is built
# to answer ALL whenever it is unsure, and hand-narrowing past it gives up that
# protection.
name: Production

on:
  workflow_dispatch:
    inputs:
      instances:
        description: 'Instances to apply (comma-separated), or ALL'
        required: false
        default: 'ALL'
        type: string

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      # The production environment carries a fly:walgit resource, and the fly
      # module shells out to flyctl — which ubuntu-latest does not ship.
      # Preview has no fly resource, so preview.yml needs no equivalent step.
      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Decrypt secrets & deploy
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          INSTANCES: ${{ inputs.instances }}
        run: |
          set -euo pipefail
          if [ -z "$INSTANCES" ] || [ "$INSTANCES" = "ALL" ]; then
            bun run --cwd packages/cli src/index.ts apply production
          else
            bun run --cwd packages/cli src/index.ts apply production --only "$INSTANCES"
          fi
